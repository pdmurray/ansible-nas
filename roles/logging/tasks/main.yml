---
- name: Start centralized logging stack
  when: logging_stack_enabled | bool
  block:
    - name: Require a non-default Grafana administrator password
      ansible.builtin.assert:
        that:
          - logging_grafana_admin_password | length >= 12
          - logging_grafana_admin_password != 'admin'
        fail_msg: >-
          Set logging_grafana_admin_password to a unique value of at least 12
          characters, preferably in Ansible Vault.

    - name: Create logging stack directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ logging_data_directory }}", owner: root, group: root, mode: "0750"}
        - {path: "{{ logging_data_directory }}/alloy", owner: root, group: root, mode: "0750"}
        - {path: "{{ logging_data_directory }}/alloy/data", owner: root, group: root, mode: "0750"}
        - {path: "{{ logging_data_directory }}/grafana/data", owner: "472", group: "472", mode: "0750"}
        - {path: "{{ logging_data_directory }}/grafana/dashboards", owner: root, group: root, mode: "0755"}
        - {path: "{{ logging_data_directory }}/grafana/provisioning/dashboards", owner: root, group: root, mode: "0755"}
        - {path: "{{ logging_data_directory }}/grafana/provisioning/datasources", owner: root, group: root, mode: "0755"}
        - {path: "{{ logging_data_directory }}/grafana/provisioning/alerting", owner: root, group: root, mode: "0755"}
        - {path: "{{ logging_data_directory }}/loki", owner: "10001", group: "10001", mode: "0750"}
        - {path: "{{ logging_data_directory }}/loki/data", owner: "10001", group: "10001", mode: "0750"}

    - name: Template logging stack configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: alloy-config.alloy.j2, dest: "{{ logging_data_directory }}/alloy/config.alloy"}
        - {src: loki-config.yml.j2, dest: "{{ logging_data_directory }}/loki/config.yml"}
        - {src: grafana-datasource.yml.j2, dest: "{{ logging_data_directory }}/grafana/provisioning/datasources/loki.yml"}
        - {src: grafana-dashboard-provider.yml.j2, dest: "{{ logging_data_directory }}/grafana/provisioning/dashboards/logging.yml"}
        - {src: grafana-alert-rules.yml.j2, dest: "{{ logging_data_directory }}/grafana/provisioning/alerting/logging.yml"}
        - {src: docker-logs-dashboard.json.j2, dest: "{{ logging_data_directory }}/grafana/dashboards/docker-logs.json"}
      register: logging_configuration

    - name: Create logging Docker network
      community.docker.docker_network:
        name: "{{ logging_network_name }}"
        state: present

    - name: Create Loki container
      community.docker.docker_container:
        name: "{{ logging_loki_container_name }}"
        image: "{{ logging_loki_image }}"
        pull: true
        command: -config.file=/etc/loki/config.yml
        volumes:
          - "{{ logging_data_directory }}/loki/config.yml:/etc/loki/config.yml:ro"
          - "{{ logging_data_directory }}/loki/data:/loki:rw"
        networks:
          - name: "{{ logging_network_name }}"
        networks_cli_compatible: true
        restart_policy: unless-stopped
        restart: "{{ logging_configuration is changed }}"
        memory: "{{ logging_loki_memory }}"
        healthcheck:
          test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
          interval: 30s
          timeout: 5s
          retries: 5
          start_period: 20s

    - name: Create Alloy container
      community.docker.docker_container:
        name: "{{ logging_alloy_container_name }}"
        image: "{{ logging_alloy_image }}"
        pull: true
        user: "0:0"
        command: >-
          run --server.http.listen-addr=0.0.0.0:12345
          --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
        volumes:
          - "{{ logging_data_directory }}/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          - "{{ logging_data_directory }}/alloy/data:/var/lib/alloy/data:rw"
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
        networks:
          - name: "{{ logging_network_name }}"
        networks_cli_compatible: true
        restart_policy: unless-stopped
        restart: "{{ logging_configuration is changed }}"
        memory: "{{ logging_alloy_memory }}"

    - name: Create Grafana container
      community.docker.docker_container:
        name: "{{ logging_grafana_container_name }}"
        image: "{{ logging_grafana_image }}"
        pull: true
        ports:
          - "{{ logging_grafana_bind_address }}:{{ logging_grafana_port }}:3000"
        volumes:
          - "{{ logging_data_directory }}/grafana/data:/var/lib/grafana:rw"
          - "{{ logging_data_directory }}/grafana/provisioning:/etc/grafana/provisioning:ro"
          - "{{ logging_data_directory }}/grafana/dashboards:/etc/grafana/dashboards:ro"
        env:
          GF_SECURITY_ADMIN_USER: "{{ logging_grafana_admin_user }}"
          GF_SECURITY_ADMIN_PASSWORD: "{{ logging_grafana_admin_password }}"
          GF_USERS_ALLOW_SIGN_UP: "{{ logging_grafana_allow_sign_up | string | lower }}"
          GF_SERVER_ROOT_URL: "{{ logging_grafana_root_url }}"
          GF_UNIFIED_ALERTING_ENABLED: "true"
        networks:
          - name: "{{ logging_network_name }}"
        networks_cli_compatible: true
        restart_policy: unless-stopped
        restart: "{{ logging_configuration is changed }}"
        memory: "{{ logging_grafana_memory }}"
        labels:
          homepage.group: Monitoring
          homepage.name: Centralized Logs
          homepage.icon: grafana
          homepage.href: "{{ logging_grafana_root_url }}"
          homepage.description: Search Docker logs and review log alerts.
      no_log: true

- name: Stop centralized logging stack
  when: not (logging_stack_enabled | bool)
  block:
    - name: Remove logging stack containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ logging_grafana_container_name }}"
        - "{{ logging_alloy_container_name }}"
        - "{{ logging_loki_container_name }}"

    - name: Remove logging Docker network
      community.docker.docker_network:
        name: "{{ logging_network_name }}"
        state: absent
        force: false
